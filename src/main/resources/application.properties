spring.application.name=location-app
# Render supplies PORT at runtime; use 8080 for local development.
server.port=${PORT:8080}

# Secrets must be supplied as environment variables, never committed to Git.
locationiq.token=${LOCATIONIQ_TOKEN:}
# Spring Boot 4 uses spring.mongodb.* (the older spring.data.mongodb.* keys are ignored).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/locationdb}
spring.mongodb.database=${MONGODB_DATABASE:locationdb}

# Comma-separated frontend origin patterns. Set this to your production domain when deploying.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://bestue.netlify.app,http://localhost:*,http://127.0.0.1:*}
# Store GPS and Geo-IP results. Set false only when storage is not permitted.
app.location.store-enabled=${STORE_LOCATIONS:true}

# Photo-session uploads and optional location metadata.
spring.servlet.multipart.max-file-size=${PHOTO_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${PHOTO_MAX_REQUEST_SIZE:11MB}
app.photo.max-image-bytes=${PHOTO_MAX_IMAGE_BYTES:10485760}
app.photo.max-image-dimension=${PHOTO_MAX_IMAGE_DIMENSION:12000}
app.photo.max-location-accuracy=${PHOTO_MAX_LOCATION_ACCURACY:100000}

# Backend-only Gemini image editing.
app.photo.gemini.api-key=${GEMINI_API_KEY:}
app.photo.gemini.model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
app.photo.gemini.connect-timeout-millis=${GEMINI_CONNECT_TIMEOUT_MS:5000}
app.photo.gemini.read-timeout-millis=${GEMINI_READ_TIMEOUT_MS:120000}

# Cloudinary keeps original and enhanced photos as separate assets.
app.photo.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.photo.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.photo.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# When present, uploads use this unsigned preset instead of API-key authentication.
app.photo.cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
app.photo.cloudinary.connect-timeout-millis=${CLOUDINARY_CONNECT_TIMEOUT_MS:5000}
app.photo.cloudinary.read-timeout-millis=${CLOUDINARY_READ_TIMEOUT_MS:45000}

# Bounded background executor for paid Gemini operations.
app.photo.processing.core-pool-size=${PHOTO_PROCESSING_CORE_POOL_SIZE:2}
app.photo.processing.max-pool-size=${PHOTO_PROCESSING_MAX_POOL_SIZE:4}
app.photo.processing.queue-capacity=${PHOTO_PROCESSING_QUEUE_CAPACITY:20}
