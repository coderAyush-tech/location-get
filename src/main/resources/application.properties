spring.application.name=location-app
# Render supplies PORT at runtime; use 8080 for local development.
server.port=${PORT:8080}

# Secrets must be supplied as environment variables, never committed to Git.
locationiq.token=${LOCATIONIQ_TOKEN:}
# Spring Boot 4 uses spring.mongodb.* (the older spring.data.mongodb.* keys are ignored).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/locationdb}
spring.mongodb.database=${MONGODB_DATABASE:locationdb}

# Comma-separated frontend origin patterns. Set this to your production domain when deploying.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://bestue.netlify.app,http://localhost:*,http://127.0.0.1:*}
# Store GPS and Geo-IP results. Set false only when storage is not permitted.
app.location.store-enabled=${STORE_LOCATIONS:true}

# Secret header used only by the external keep-alive monitor.
app.keep-alive.token=${KEEP_ALIVE_TOKEN:}

# Camera photo upload. Images are stored directly in MongoDB as BSON binary.
# Keep this below MongoDB's 16 MB document limit.
spring.servlet.multipart.max-file-size=${PHOTO_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${PHOTO_MAX_REQUEST_SIZE:11MB}
app.capture.max-image-bytes=${PHOTO_MAX_IMAGE_BYTES:10485760}
app.capture.max-image-dimension=${PHOTO_MAX_IMAGE_DIMENSION:12000}
