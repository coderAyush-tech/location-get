spring.application.name=location-app
# Render supplies PORT at runtime; use 8080 for local development.
server.port=${PORT:8080}

# Secrets must be supplied as environment variables, never committed to Git.
locationiq.token=${LOCATIONIQ_TOKEN:}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/locationdb}
spring.data.mongodb.database=${MONGODB_DATABASE:locationdb}

# Comma-separated frontend origin patterns. Set this to your production domain when deploying.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
# Store GPS and Geo-IP results. Set false only when storage is not permitted.
app.location.store-enabled=${STORE_LOCATIONS:true}
